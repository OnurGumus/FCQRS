<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="q-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5484D"/></marker>
    <marker id="q-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="q-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
    <style>
      .title { font-size:22px; font-weight:700; fill:#0F172A; }
      .subtitle { font-size:13.5px; fill:#475569; }
      .hlbl { font-size:15px; font-weight:700; }
      .hsub { font-size:11px; }
      .life { stroke:#CBD5E1; stroke-width:1.5; stroke-dasharray:4 4; }
      .edge-red { fill:none; stroke:#E5484D; stroke-width:2.5; }
      .edge-blue { fill:none; stroke:#2563EB; stroke-width:2.5; }
      .edge-gray { fill:none; stroke:#94A3B8; stroke-width:2.2; stroke-dasharray:6 4; }
      .elbl { font-size:12.5px; font-weight:600; }
      .badge { font-size:11px; font-weight:700; fill:#fff; }
      .leg { font-size:12px; font-weight:600; }
    </style>
  </defs>

  <rect width="960" height="640" fill="#FFFFFF"/>
  <text class="title" x="40" y="40">How the transfer saga starts: the start handshake</text>
  <text class="subtitle" x="40" y="63">Read top to bottom. Alice's account stores TransferSent only after the transfer saga listens for it.</text>

  <!-- legend -->
  <line class="edge-red" x1="586" y1="92" x2="612" y2="92"/><text class="leg" x="618" y="96" fill="#B4262A">command</text>
  <line class="edge-blue" x1="700" y1="92" x2="726" y2="92"/><text class="leg" x="732" y="96" fill="#1D4ED8">event</text>
  <line class="edge-gray" x1="792" y1="92" x2="818" y2="92"/><text class="leg" x="824" y="96" fill="#64748B">internal</text>

  <!-- lifelines -->
  <line class="life" x1="190" y1="170" x2="190" y2="590"/>
  <line class="life" x1="500" y1="170" x2="500" y2="590"/>
  <line class="life" x1="810" y1="170" x2="810" y2="590"/>

  <!-- headers -->
  <rect x="110" y="116" width="160" height="54" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text class="hlbl" x="190" y="142" text-anchor="middle" fill="#0F172A">Account alice</text>
  <text class="hsub" x="190" y="159" text-anchor="middle" fill="#64748B">originator aggregate</text>
  <rect x="420" y="116" width="160" height="54" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text class="hlbl" x="500" y="142" text-anchor="middle" fill="#581C87">Transfer saga t1</text>
  <text class="hsub" x="500" y="159" text-anchor="middle" fill="#6B21A8">stored workflow progress</text>
  <rect x="730" y="116" width="160" height="54" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text class="hlbl" x="810" y="142" text-anchor="middle" fill="#0F172A">Account bob</text>
  <text class="hsub" x="810" y="159" text-anchor="middle" fill="#64748B">transfer target</text>

  <!-- alice waits from step 2 until the saga is ready -->
  <rect x="184" y="262" width="12" height="108" fill="#FEE2E2" stroke="#E5484D" stroke-width="1.2"/>
  <text class="hsub" x="132" y="316" text-anchor="middle" fill="#B4262A" transform="rotate(-90 132 316)">waits, stashing commands</text>

  <!-- 1 command -->
  <circle cx="60" cy="200" r="10" fill="#E5484D"/><text class="badge" x="60" y="204" text-anchor="middle">1</text>
  <text class="elbl" x="76" y="204" fill="#B4262A">command: SendTransfer t1</text>
  <path class="edge-red" d="M50,216 L186,216" marker-end="url(#q-red)"/>

  <!-- 2 starting message -->
  <circle cx="206" cy="248" r="10" fill="#94A3B8"/><text class="badge" x="206" y="252" text-anchor="middle">2</text>
  <text class="elbl" x="222" y="252" fill="#64748B">TransferSent matches StartOn: start the saga</text>
  <path class="edge-gray" d="M190,266 L500,266" marker-end="url(#q-gray)"/>

  <!-- 3 saga stores and subscribes -->
  <circle cx="516" cy="306" r="10" fill="#7C3AED"/><text class="badge" x="516" y="310" text-anchor="middle">3</text>
  <text class="elbl" x="532" y="310" fill="#6B21A8">store its start; subscribe to the event's topic</text>

  <!-- 4 ready -->
  <circle cx="206" cy="348" r="10" fill="#94A3B8"/><text class="badge" x="206" y="352" text-anchor="middle">4</text>
  <text class="elbl" x="222" y="352" fill="#64748B">ready</text>
  <path class="edge-gray" d="M500,366 L194,366" marker-end="url(#q-gray)"/>

  <!-- 5 event stored and published -->
  <circle cx="206" cy="400" r="10" fill="#2563EB"/><text class="badge" x="206" y="404" text-anchor="middle">5</text>
  <text class="elbl" x="222" y="404" fill="#1D4ED8">TransferSent stored and published</text>
  <path class="edge-blue" d="M190,418 L500,418" marker-end="url(#q-blue)"/>

  <!-- 6 command to bob -->
  <circle cx="516" cy="452" r="10" fill="#E5484D"/><text class="badge" x="516" y="456" text-anchor="middle">6</text>
  <text class="elbl" x="532" y="456" fill="#B4262A">store Delivering; send ReceiveTransfer</text>
  <path class="edge-red" d="M500,470 L810,470" marker-end="url(#q-red)"/>

  <!-- 7 answer -->
  <circle cx="532" cy="504" r="10" fill="#94A3B8"/><text class="badge" x="532" y="508" text-anchor="middle">7</text>
  <text class="elbl" x="548" y="508" fill="#64748B">TransferReceived or Rejected</text>
  <path class="edge-gray" d="M810,522 L500,522" marker-end="url(#q-gray)"/>

  <!-- 8 continues -->
  <circle cx="516" cy="568" r="10" fill="#7C3AED"/><text class="badge" x="516" y="572" text-anchor="middle">8</text>
  <text class="elbl" x="532" y="572" fill="#6B21A8">store Completed, or Refunding</text>
</svg>
