<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="st-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E5484D"/></marker>
    <marker id="st-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="st-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
    <marker id="st-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <style>
      .title { font-size:20px; font-weight:700; fill:#0F172A; }
      .subtitle { font-size:13px; fill:#475569; }
      .head { font-size:15px; font-weight:700; }
      .note { font-size:12px; fill:#64748B; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; }
      .small { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
      .lane { font-size:11px; font-weight:700; letter-spacing:0.08em; }
      .lbl { font-size:12px; font-weight:700; }
    </style>
  </defs>

  <rect width="760" height="470" fill="#FFFFFF"/>
  <text class="title" x="30" y="36">Commands and queries use different models</text>
  <text class="subtitle" x="30" y="58">The account decides and stores events. A projection turns stored events into statement rows,</text>
  <text class="subtitle" x="30" y="76">and the program reads those rows with SQL.</text>

  <!-- lanes -->
  <rect x="20" y="92" width="720" height="130" rx="10" fill="#F8FAFC"/>
  <text class="lane" x="34" y="112" fill="#94A3B8">WRITE SIDE</text>
  <rect x="20" y="232" width="720" height="176" rx="10" fill="#F0FDF4"/>
  <text class="lane" x="34" y="252" fill="#86C29B">READ SIDE</text>

  <!-- write side -->
  <rect x="34" y="138" width="150" height="36" rx="18" fill="#FEF2F2" stroke="#E5484D" stroke-width="1.6"/>
  <text class="code" x="109" y="161" text-anchor="middle" fill="#B4262A">Withdraw 30</text>
  <path d="M186,146 L226,146" fill="none" stroke="#E5484D" stroke-width="2.5" marker-end="url(#st-red)"/>
  <text class="lbl" x="206" y="138" text-anchor="middle" fill="#B4262A">1</text>
  <path d="M228,168 L190,168" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#st-gray)"/>
  <text class="lbl" x="208" y="186" text-anchor="middle" fill="#64748B">3</text>

  <rect x="230" y="120" width="170" height="72" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
  <text class="head" x="315" y="148" text-anchor="middle" fill="#0F172A">Account "alice"</text>
  <text class="note" x="315" y="168" text-anchor="middle">decide, then store</text>
  <path d="M402,156 L446,156" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#st-blue)"/>
  <text class="lbl" x="424" y="146" text-anchor="middle" fill="#1D4ED8">2</text>

  <rect x="450" y="104" width="276" height="106" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text class="head" x="464" y="126" fill="#334155">journal</text>
  <text class="small" x="464" y="148" fill="#0F172A">1  Opened "Alice"</text>
  <text class="small" x="464" y="168" fill="#0F172A">2  Deposited 100</text>
  <rect x="458" y="176" width="200" height="22" rx="4" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="small" x="464" y="192" fill="#1D4ED8">3  Withdrawn 30</text>

  <text class="note" x="34" y="200">reply: Withdrew 30 (version 3)</text>

  <!-- read side -->
  <path d="M600,212 L600,262" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#st-green)"/>
  <text class="lbl" x="612" y="242" fill="#15803D">4</text>
  <text class="note" x="588" y="242" text-anchor="end">new events, in order per account</text>

  <rect x="450" y="266" width="276" height="72" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
  <text class="head" x="588" y="292" text-anchor="middle" fill="#14532D">projection</text>
  <text class="small" x="588" y="310" text-anchor="middle" fill="#0F172A">Statement.handle</text>
  <text class="note" x="588" y="328" text-anchor="middle">rows and progress in one transaction</text>

  <path d="M448,302 L424,302" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#st-green)"/>
  <text class="lbl" x="436" y="292" text-anchor="middle" fill="#15803D">5</text>

  <rect x="186" y="262" width="234" height="104" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
  <text class="head" x="200" y="284" fill="#14532D">statement</text>
  <text class="note" x="406" y="284" text-anchor="end">balance</text>
  <text class="small" x="200" y="304" fill="#0F172A" xml:space="preserve">1  Opened for Alice       0</text>
  <text class="small" x="200" y="322" fill="#0F172A" xml:space="preserve">2  Deposit              100</text>
  <rect x="194" y="330" width="218" height="22" rx="4" fill="#DCFCE7" stroke="#15803D"/>
  <text class="small" x="200" y="346" fill="#14532D" xml:space="preserve">3  Withdrawal            70</text>

  <rect x="34" y="296" width="120" height="36" rx="18" fill="#F0FDF4" stroke="#15803D" stroke-width="1.6"/>
  <text class="code" x="94" y="319" text-anchor="middle" fill="#14532D">SELECT …</text>
  <path d="M156,314 L182,314" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#st-green)"/>
  <text class="lbl" x="169" y="304" text-anchor="middle" fill="#15803D">7</text>

  <path d="M588,340 L588,384 L94,384 L94,336" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#st-gray)"/>
  <text class="note" x="344" y="400" text-anchor="middle">6  notification with the command's correlation ID, after the commit</text>

  <text class="note" x="30" y="436">The reply (3) can arrive before the statement row exists (5). sendAwaiting returns after the notification (6),</text>
  <text class="note" x="30" y="454">so the query (7) sees the new row.</text>
</svg>
