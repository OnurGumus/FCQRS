<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tw-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="tw-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="tw-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
    <style>
      .title { font-size:20px; font-weight:700; fill:#0F172A; }
      .subtitle { font-size:13px; fill:#475569; }
      .head { font-size:14px; font-weight:700; fill:#0F172A; }
      .note { font-size:12px; fill:#64748B; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
      .section { font-size:12px; font-weight:700; fill:#334155; }
    </style>
  </defs>

  <rect width="760" height="640" fill="#FFFFFF"/>
  <text class="title" x="30" y="36">A workflow finishes a transfer, or gives the money back</text>
  <text class="subtitle" x="30" y="58">The application starts the workflow with the transfer's ID. Each send is a step: the</text>
  <text class="subtitle" x="30" y="76">workflow stores the reply, and after a restart it continues after the last stored step.</text>

  <!-- participants -->
  <rect x="40" y="96" width="160" height="34" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.6"/>
  <text class="head" x="120" y="118" text-anchor="middle">Account "alice"</text>
  <rect x="300" y="96" width="160" height="34" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text class="head" x="380" y="118" text-anchor="middle" fill="#5B21B6">Transfer workflow</text>
  <rect x="560" y="96" width="160" height="34" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.6"/>
  <text class="head" x="640" y="118" text-anchor="middle">target account</text>
  <path d="M120,130 L120,590 M380,130 L380,590 M640,130 L640,590" fill="none" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 4"/>

  <!-- t1 -->
  <text class="section" x="30" y="156">t1: 30 to bob</text>
  <rect x="328" y="164" width="104" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="code" x="380" y="180" text-anchor="middle" fill="#5B21B6">Start "t1"</text>
  <path d="M336,208 L124,208" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#tw-violet)"/>
  <text class="code" x="230" y="200" text-anchor="middle" fill="#5B21B6">SendTransfer t1</text>
  <rect x="36" y="218" width="168" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="code" x="120" y="234" text-anchor="middle" fill="#1D4ED8">TransferSent  -30</text>
  <path d="M206,230 L376,246" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tw-gray)"/>
  <path d="M424,262 L636,262" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#tw-violet)"/>
  <text class="code" x="530" y="254" text-anchor="middle" fill="#5B21B6">ReceiveTransfer t1</text>
  <rect x="556" y="272" width="168" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="code" x="640" y="288" text-anchor="middle" fill="#1D4ED8">TransferReceived +30</text>
  <text class="note" x="640" y="312" text-anchor="middle">bob's account</text>
  <path d="M554,284 L424,316" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tw-gray)"/>
  <rect x="338" y="310" width="84" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="code" x="380" y="326" text-anchor="middle" fill="#5B21B6">Completed</text>

  <!-- t2 -->
  <text class="section" x="30" y="366">t2: 20 to carol, who has no account</text>
  <rect x="328" y="374" width="104" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="code" x="380" y="390" text-anchor="middle" fill="#5B21B6">Start "t2"</text>
  <path d="M336,418 L124,418" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#tw-violet)"/>
  <text class="code" x="230" y="410" text-anchor="middle" fill="#5B21B6">SendTransfer t2</text>
  <rect x="36" y="428" width="168" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="code" x="120" y="444" text-anchor="middle" fill="#1D4ED8">TransferSent  -20</text>
  <path d="M206,440 L376,456" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tw-gray)"/>
  <path d="M424,472 L636,472" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#tw-violet)"/>
  <text class="code" x="530" y="464" text-anchor="middle" fill="#5B21B6">ReceiveTransfer t2</text>
  <rect x="556" y="482" width="168" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="5 4"/>
  <text class="code" x="640" y="498" text-anchor="middle" fill="#0F172A">Rejected</text>
  <text class="note" x="640" y="522" text-anchor="middle">carol's account: not open,</text>
  <text class="note" x="640" y="538" text-anchor="middle">nothing stored</text>
  <path d="M554,494 L424,510" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tw-gray)"/>
  <path d="M336,524 L124,524" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#tw-violet)"/>
  <text class="code" x="230" y="516" text-anchor="middle" fill="#5B21B6">RefundTransfer t2</text>
  <rect x="36" y="534" width="168" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="code" x="120" y="550" text-anchor="middle" fill="#1D4ED8">TransferRefunded +20</text>
  <path d="M206,546 L336,566" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tw-gray)"/>
  <rect x="338" y="560" width="84" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="code" x="380" y="576" text-anchor="middle" fill="#5B21B6">Refunded</text>

  <text class="note" x="30" y="620">Blue: stored by an account. Violet: started, sent, or returned by the workflow. Dashed: a reply.</text>
</svg>
