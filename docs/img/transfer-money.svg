<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tm-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="tm-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="tm-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
    <style>
      .title { font-size:20px; font-weight:700; fill:#0F172A; }
      .subtitle { font-size:13px; fill:#475569; }
      .head { font-size:14px; font-weight:700; fill:#0F172A; }
      .note { font-size:12px; fill:#64748B; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
      .section { font-size:12px; font-weight:700; fill:#334155; }
    </style>
  </defs>

  <rect width="760" height="620" fill="#FFFFFF"/>
  <text class="title" x="30" y="36">A saga finishes a transfer, or gives the money back</text>
  <text class="subtitle" x="30" y="58">Each account stores its own events. The saga stores where the transfer is and sends the</text>
  <text class="subtitle" x="30" y="76">next command, again after a restart.</text>

  <!-- participants -->
  <rect x="40" y="96" width="160" height="34" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.6"/>
  <text class="head" x="120" y="118" text-anchor="middle">Account "alice"</text>
  <rect x="300" y="96" width="160" height="34" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text class="head" x="380" y="118" text-anchor="middle" fill="#5B21B6">Transfer saga</text>
  <rect x="560" y="96" width="160" height="34" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.6"/>
  <text class="head" x="640" y="118" text-anchor="middle">target account</text>
  <path d="M120,130 L120,568 M380,130 L380,568 M640,130 L640,568" fill="none" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 4"/>

  <!-- t1 -->
  <text class="section" x="30" y="156">t1: 30 to bob</text>
  <rect x="36" y="166" width="168" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="code" x="120" y="182" text-anchor="middle" fill="#1D4ED8">TransferSent  -30</text>
  <path d="M206,178 L336,178" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#tm-blue)"/>
  <text class="note" x="268" y="170" text-anchor="middle">starts a saga</text>
  <rect x="338" y="166" width="84" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="code" x="380" y="182" text-anchor="middle" fill="#5B21B6">Delivering</text>

  <path d="M424,212 L636,212" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#tm-violet)"/>
  <text class="code" x="530" y="204" text-anchor="middle" fill="#5B21B6">ReceiveTransfer t1</text>
  <rect x="556" y="222" width="168" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="code" x="640" y="238" text-anchor="middle" fill="#1D4ED8">TransferReceived +30</text>
  <text class="note" x="640" y="262" text-anchor="middle">bob's account</text>
  <path d="M554,234 L424,272" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tm-gray)"/>
  <rect x="338" y="266" width="84" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="code" x="380" y="282" text-anchor="middle" fill="#5B21B6">Completed</text>

  <!-- t2 -->
  <text class="section" x="30" y="322">t2: 20 to carol, who has no account</text>
  <rect x="36" y="332" width="168" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="code" x="120" y="348" text-anchor="middle" fill="#1D4ED8">TransferSent  -20</text>
  <path d="M206,344 L336,344" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#tm-blue)"/>
  <text class="note" x="268" y="336" text-anchor="middle">starts a saga</text>
  <rect x="338" y="332" width="84" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="code" x="380" y="348" text-anchor="middle" fill="#5B21B6">Delivering</text>

  <path d="M424,378 L636,378" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#tm-violet)"/>
  <text class="code" x="530" y="370" text-anchor="middle" fill="#5B21B6">ReceiveTransfer t2</text>
  <rect x="556" y="388" width="168" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="5 4"/>
  <text class="code" x="640" y="404" text-anchor="middle" fill="#0F172A">Rejected</text>
  <text class="note" x="640" y="428" text-anchor="middle">carol's account: not open,</text>
  <text class="note" x="640" y="444" text-anchor="middle">nothing stored</text>
  <path d="M554,400 L424,438" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tm-gray)"/>
  <rect x="338" y="432" width="84" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="code" x="380" y="448" text-anchor="middle" fill="#5B21B6">Refunding</text>

  <path d="M336,480 L124,480" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#tm-violet)"/>
  <text class="code" x="230" y="472" text-anchor="middle" fill="#5B21B6">RefundTransfer t2</text>
  <rect x="36" y="490" width="168" height="24" rx="5" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="code" x="120" y="506" text-anchor="middle" fill="#1D4ED8">TransferRefunded +20</text>
  <path d="M206,502 L336,540" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tm-gray)"/>
  <rect x="338" y="534" width="84" height="24" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="code" x="380" y="550" text-anchor="middle" fill="#5B21B6">Completed</text>

  <text class="note" x="30" y="600">Blue: stored by an account. Violet: stored or sent by the saga. Dashed: a reply.</text>
</svg>
